# =============================================================================
# DDLnzb Bridge - CI
# =============================================================================
# Builds the bridge image as multi-arch (linux/amd64 + linux/arm64) and pushes
# it to ghcr.io/ddlnzb/bridge.
#
# Why two platforms: the bridge runs on the x86_64 Unraid production host and
# on ARM64 dev hosts. An arm64-only image cannot be pulled on x86_64
# ("no matching manifest").
#
# The code in this repo is a mirror from the monorepo. The sync runs
# there: .github/workflows/ci.yml (job `sync-bridge-public`).
#
# The image is pushed with the GITHUB_TOKEN of this repo. That sets the
# access rights of the package to this repo - the package belongs to the
# DDLnzb organization.
#
# IMPORTANT: The visibility of the package must be set to "public" ONCE by
# hand (GitHub UI: Packages -> ddlnzb-bridge -> Package settings
# -> Change visibility -> Public). The GITHUB_TOKEN cannot do this - the
# change requires a token with `write:packages` and `admin:org`. The
# job `check-visibility` reports while that is missing.
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # The registry requires lowercase in the path. `github.repository` returns
  # the spelling of the org ("DDLnzb") - that becomes a tag which buildx
  # rejects with "repository name must be lowercase". The org is therefore
  # set in lowercase here; the repo name is already lowercase.
  IMAGE_NAME: ddlnzb/${{ github.event.repository.name }}

jobs:
  # ===========================
  # Tests
  # ===========================
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pip install "poetry==1.7.1"

      - name: Install dependencies
        run: poetry config virtualenvs.create false && poetry install --no-interaction --no-ansi --no-root --with dev

      - name: Run tests
        # The test modules import absolutely as `from app.…`. In the monorepo
        # `working-directory: bridge` provides the matching root; in the public
        # repo the code already lives in the root, but pytest does not put the
        # root directory on the import path automatically. PYTHONPATH ensures this.
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: poetry run pytest tests/ -v

  # ===========================
  # Build and publish image
  # ===========================
  build:
    name: Build image (${{ matrix.platform }})
    # Two jobs: one builds arm64 natively, the other amd64 natively. That is
    # faster and more reliable than a multi-arch build with QEMU, where the
    # foreign-arch branch runs emulated (the Poetry install under emulation
    # costs minutes).
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            suffix: amd64
          - platform: linux/arm64
            suffix: arm64
    steps:
      - uses: actions/checkout@v7

      - name: Prepare image metadata
        id: meta
        run: |
          echo "version=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          # Each architecture job pushes to its own tag with a suffix. Only
          # once both exist can the manifest job merge them.
          echo "tag=${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA::12}-${{ matrix.suffix }}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tag }}
          labels: |
            org.opencontainers.image.title=DDLnzb Bridge
            org.opencontainers.image.description=SABnzbd-compatible download bridge for DDLnzb
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}

  # ===========================
  # Multi-arch manifest
  # ===========================
  manifest:
    name: Merge manifest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build]
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Push manifest with both platforms
        run: |
          set -euo pipefail
          version="${GITHUB_SHA::12}"
          image="${REGISTRY}/${IMAGE_NAME}"
          # The architecture jobs push to tags with a platform suffix, so that
          # both images exist before the manifest merges them.
          #
          # Important: `imagetools create` REPLACES the target tag. A second
          # invocation on the same tag would overwrite the first manifest
          # again - the manifest would then contain only one platform.
          # Therefore a single invocation merges both platforms.
          docker buildx imagetools create \
            --tag "${image}:${version}" \
            "${image}:${version}-amd64" \
            "${image}:${version}-arm64"
          # `latest` points to the manifest, not to a single-arch image.
          docker buildx imagetools create \
            --tag "${image}:latest" \
            "${image}:${version}"
          echo "::notice::Manifest ${image}:${version} created"

      - name: Check that both platforms are in the manifest
        run: |
          set -euo pipefail
          image="${REGISTRY}/${IMAGE_NAME}"
          out=$(docker buildx imagetools inspect "${image}:latest")
          for plat in linux/amd64 linux/arm64; do
            if ! grep -qE "Platform: +$plat" <<<"$out"; then
              echo "::error::Manifest does not contain $plat - the pull on x86_64 hosts fails"
              echo "$out"
              exit 1
            fi
          done
          echo "::notice::Manifest contains linux/amd64 and linux/arm64"

  # ===========================
  # Check visibility
  # ===========================
  # The GITHUB_TOKEN cannot set the package visibility to "public" - the
  # change requires a token with `write:packages` and `admin:org`.
  # The job warns as long as the image is not anonymously pullable, and still
  # lets the build pass: the visibility is a one-time action of the
  # operator, not a build error.
  check-visibility:
    name: Check package visibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [manifest]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Read visibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          name="${IMAGE_NAME##*/}"
          visibility=$(gh api "/orgs/ddlnzb/packages/container/${name}" \
            --jq '.visibility' 2>/dev/null || echo "unknown")
          echo "::notice::Package ${name} has the visibility '${visibility}'"
          if [ "$visibility" != "public" ]; then
            echo "::warning::The image is not yet anonymously pullable. Change it once by hand: GitHub -> Organization DDLnzb -> Packages -> ${name} -> Package settings -> Change visibility -> Public"
            echo "::warning::Until then 'docker pull ghcr.io/ddlnzb/bridge:latest' fails without a registry login."
          fi
