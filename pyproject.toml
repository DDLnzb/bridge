[tool.poetry]
name = "ddlnzb-bridge"
version = "0.1.0"
description = "DDLnzb Bridge - Local JDownloader Integration"
authors = ["DDLnzb Team"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.10"
fastapi = ">=0.135.3,<0.144.0"
uvicorn = {extras = ["standard"], version = ">=0.43,<0.55"}
httpx = "^0.28.1"
pydantic = "^2.5.3"
pydantic-settings = "^2.1.0"
myjdapi = "^1.1.6"
python-dotenv = "^1.2.2"
prometheus-client = ">=0.24.1,<0.27.0"
exceptiongroup = {version = "^1.2.0", python = "<3.11"}

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
pytest-asyncio = "^1.3.0"
ruff = ">=0.15,<0.18"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py310"
line-length = 100
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
