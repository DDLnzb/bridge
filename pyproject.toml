[tool.poetry]
name = "ddlnzb-bridge"
version = "0.1.0"
description = "DDLnzb Bridge - Local JDownloader Integration"
authors = ["DDLnzb Team"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.128.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
httpx = "^0.28.1"
pydantic = "^2.5.3"
pydantic-settings = "^2.1.0"
myjdapi = "^1.1.6"
python-dotenv = "^1.0.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.25.0"
ruff = "^0.1.15"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
